<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-strong"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4"><rect width="4" height="2" fill="rgba(255,255,255,0.015)"/></pattern>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    @keyframes revealLetter { 0% { opacity: 0; fill: #0ff; } 15% { opacity: 1; fill: #0ff; } 40% { fill: #58ff58; } 100% { fill: #e0ffe0; } }
    @keyframes fadeIn { 0%, 70% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes shimmer { 0% { fill: #ffd700; } 50% { fill: #ffec80; } 100% { fill: #ffd700; } }
    @keyframes drawBorder { 0% { stroke-dashoffset: 1200; } 100% { stroke-dashoffset: 0; } }
    @keyframes haloGlow { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }
    @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.9; } }
    .td { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 84px; }
    .tg { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 84px; }
    .sub { font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 16px; fill: #88cc88; }
    .pr { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 28px; }
  </style>
  <rect width="800" height="260" rx="16" fill="#0d1117"/>
  <rect width="800" height="260" rx="16" fill="url(#scanlines)"/>
  <rect x="16" y="16" width="768" height="228" rx="12" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="1200" stroke-dashoffset="1200" style="animation: drawBorder 1.5s ease-out 0.2s forwards;"/>
  <circle cx="44" cy="38" r="6" fill="#ff5f57" opacity="0.9"/>
  <circle cx="64" cy="38" r="6" fill="#febc2e" opacity="0.9"/>
  <circle cx="84" cy="38" r="6" fill="#28c840" opacity="0.9"/>
  <text x="48" y="152" class="pr" fill="#58ff58" filter="url(#glow)" style="animation: pulse 2s ease-in-out infinite;">❯</text>
  <text x="92" y="152" class="td" fill="#e0ffe0" filter="url(#glow)" style="animation: revealLetter 2s ease-out 0.3s both;">D</text>
  <text x="148" y="152" class="td" fill="#e0ffe0" filter="url(#glow)" style="animation: revealLetter 2s ease-out 0.45s both;">e</text>
  <text x="202" y="152" class="td" fill="#e0ffe0" filter="url(#glow)" style="animation: revealLetter 2s ease-out 0.6s both;">m</text>
  <text x="268" y="152" class="td" fill="#e0ffe0" filter="url(#glow)" style="animation: revealLetter 2s ease-out 0.75s both;">o</text>
  <text x="336" y="152" class="tg" fill="#ffd700" filter="url(#glow-strong)" style="animation: revealLetter 1.5s ease-out 1s both, shimmer 3s ease-in-out 2.5s infinite;">G</text>
  <text x="400" y="152" class="tg" fill="#ffd700" filter="url(#glow-strong)" style="animation: revealLetter 1.5s ease-out 1.15s both, shimmer 3s ease-in-out 2.65s infinite;">o</text>
  <text x="458" y="152" class="tg" fill="#ffd700" filter="url(#glow-strong)" style="animation: revealLetter 1.5s ease-out 1.3s both, shimmer 3s ease-in-out 2.8s infinite;">d</text>
  <ellipse cx="368" cy="68" rx="42" ry="10" fill="none" stroke="#ffd700" stroke-width="2" filter="url(#glow-strong)" style="animation: haloGlow 2.5s ease-in-out 2s infinite;"/>
  <text x="320" y="58" font-size="10" fill="#ffd700" style="animation: twinkle 1.8s ease-in-out 2.2s infinite;">✦</text>
  <text x="415" y="55" font-size="8" fill="#ffd700" style="animation: twinkle 2.1s ease-in-out 2.5s infinite;">✦</text>
  <text x="345" y="48" font-size="6" fill="#ffec80" style="animation: twinkle 1.5s ease-in-out 2.8s infinite;">✦</text>
  <text x="518" y="152" font-family="JetBrains Mono" font-size="22" fill="#58ff58" filter="url(#glow)" style="animation: blink 1s step-end infinite;">█</text>
  <text x="92" y="195" class="sub" style="animation: fadeIn 3s ease-out forwards;">handcrafted in uppsala 🇸🇪</text>
</svg>
